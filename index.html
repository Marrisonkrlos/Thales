<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thales Rocha Fotografia Esportiva (@thalesfotografia07)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Estilização suave de rolagem */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f0f11;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }
    .watermark-pattern {
      background-image: repeating-linear-gradient(
        -30deg,
        rgba(255, 255, 255, 0.08),
        rgba(255, 255, 255, 0.08) 2px,
        transparent 2px,
        transparent 80px
      );
    }
  </style>
</head>
<body class="bg-[#0a0a0a] text-neutral-100 min-h-screen selection:bg-amber-500 selection:text-neutral-950 flex flex-col justify-between">

  <!-- TOPO DE DESTAQUE: CANAL OFICIAL & ALTERNÂNCIA DE MODO -->
  <div class="bg-gradient-to-r from-amber-600 via-amber-500 to-amber-700 text-neutral-950 px-4 py-2 text-xs md:text-sm font-bold flex flex-wrap items-center justify-between shadow-lg sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <i data-lucide="trophy" class="w-4 h-4"></i>
      <span>Plataforma Esportiva Oficial • Thales Rocha Fotografia (@thalesfotografia07)</span>
    </div>
    <div class="flex items-center gap-2 mt-1 md:mt-0">
      <span class="text-neutral-950 font-bold hidden sm:inline text-xs">Visão:</span>
      <button id="btn-mode-client" onclick="switchViewMode('client')" class="px-3 py-1 rounded-full text-xs font-black transition-all bg-neutral-950 text-amber-400 shadow-md">
        Atleta / Torcedor
      </button>
      <button id="btn-mode-admin" onclick="switchViewMode('admin')" class="px-3 py-1 rounded-full text-xs font-black transition-all bg-neutral-950/20 text-neutral-950 hover:bg-neutral-950/40">
        Painel do Thales
      </button>
    </div>
  </div>

  <!-- NAVBAR PRINCIPAL -->
  <header class="bg-[#0a0a0a]/90 backdrop-blur-md border-b border-neutral-800 sticky top-10 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Logo do Thales Rocha Fotografia -->
      <div onclick="navigateToHome()" class="flex items-center gap-3 cursor-pointer group">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-500 via-amber-400 to-amber-300 flex items-center justify-center text-neutral-950 font-black shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform">
          <i data-lucide="camera" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-black text-lg leading-tight tracking-wider text-white group-hover:text-amber-400 transition-colors uppercase">
            THALES
